name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 验证闸门测试
        run: python -m unittest discover -s tests -v
      - name: 全库验证（严格模式）
        run: python scripts/verify_bricks.py --strict
